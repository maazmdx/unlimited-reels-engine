<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="claudeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#18120C" stop-opacity="1"/>
    </radialGradient>
    <filter id="claudeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#claudeBg)" stroke="#D97706" stroke-width="8" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="210" fill="#18120C"/>
  <!-- Anthropic Claude Asterisk Logo -->
  <g transform="translate(256, 256)" filter="url(#claudeGlow)">
    <!-- 8 rounded geometric star spokes -->
    <rect x="-24" y="-170" width="48" height="340" rx="24" fill="#D97706"/>
    <rect x="-24" y="-170" width="48" height="340" rx="24" fill="#D97706" transform="rotate(45)"/>
    <rect x="-24" y="-170" width="48" height="340" rx="24" fill="#D97706" transform="rotate(90)"/>
    <rect x="-24" y="-170" width="48" height="340" rx="24" fill="#D97706" transform="rotate(135)"/>
    <circle cx="0" cy="0" r="54" fill="#FDE68A"/>
    <circle cx="0" cy="0" r="28" fill="#D97706"/>
  </g>
</svg>
