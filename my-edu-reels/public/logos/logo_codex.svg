<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="codexBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#081014" stop-opacity="1"/>
    </radialGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#codexBg)" stroke="#10B981" stroke-width="8" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="210" fill="#081014"/>
  <!-- OpenAI Rosette Vortex Geometry -->
  <g transform="translate(256, 256)" filter="url(#emeraldGlow)">
    <g stroke="#10B981" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- 6 interlocking segments of the OpenAI vortex loop -->
      <path d="M 0,-120 C 45,-120 85,-95 105,-60 L 60,18 C 50,0 28,-14 0,-14 C -28,-14 -50,0 -60,18" />
      <path d="M 0,-120 C 45,-120 85,-95 105,-60 L 60,18 C 50,0 28,-14 0,-14 C -28,-14 -50,0 -60,18" transform="rotate(60)"/>
      <path d="M 0,-120 C 45,-120 85,-95 105,-60 L 60,18 C 50,0 28,-14 0,-14 C -28,-14 -50,0 -60,18" transform="rotate(120)"/>
      <path d="M 0,-120 C 45,-120 85,-95 105,-60 L 60,18 C 50,0 28,-14 0,-14 C -28,-14 -50,0 -60,18" transform="rotate(180)"/>
      <path d="M 0,-120 C 45,-120 85,-95 105,-60 L 60,18 C 50,0 28,-14 0,-14 C -28,-14 -50,0 -60,18" transform="rotate(240)"/>
      <path d="M 0,-120 C 45,-120 85,-95 105,-60 L 60,18 C 50,0 28,-14 0,-14 C -28,-14 -50,0 -60,18" transform="rotate(300)"/>
    </g>
    <!-- Central Bright Glowing Core -->
    <circle cx="0" cy="0" r="18" fill="#A7F3D0"/>
  </g>
</svg>
