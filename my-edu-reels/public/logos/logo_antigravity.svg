<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0F1A" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" stroke="#00F0FF" stroke-width="8" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="210" fill="#0A0F1A"/>
  <!-- 4-pointed Gemini/Antigravity Star -->
  <path d="M 256,64 Q 256,256 448,256 Q 256,256 256,448 Q 256,256 64,256 Q 256,256 256,64 Z" 
        fill="url(#starGrad)" filter="url(#neonGlow)"/>
  <!-- Center Core Diamond -->
  <polygon points="256,210 302,256 256,302 210,256" fill="#FFFFFF"/>
</svg>
