name: Render 3D Antigravity Reel ($0 Cloud CI)

on:
  workflow_dispatch:
    inputs:
      preset:
        description: 'Select Video Preset'
        required: true
        default: 'diner_fellow_3850_en'
        type: choice
        options:
          - diner_fellow_3850_en
          - diner_rejection_101_en
          - diner_vibe_coder_en
          - diner_retention_trap_en
          - diner_aws_14k_bill_en
          - diner_ai_clash_roast_en
          - compare_antigravity_vs_claude_en
          - compare_antigravity_vs_claude_hi
          - compare_antigravity_vs_claude_kn
          - compare_ai_vs_dad_wifi_en
          - compare_ai_vs_ai_clash_en
          - compare_ai_vs_human_junior_en
          - diner_gemini_antigravity_en
          - diner_gemini_antigravity_hi
          - diner_gemini_antigravity_kn
          - anime_gojo_hi
          - anime_gojo_kn
          - black_hole_time
      output_name:
        description: 'Output Video Filename'
        required: true
        default: 'antigravity_3d_reel.mp4'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-edu-reels/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (FFmpeg & Chrome libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python Speech & Audio Packages
        run: |
          pip install --upgrade edge-tts gTTS mutagen aiohttp

      - name: Install Remotion Three.js Dependencies
        working-directory: my-edu-reels
        run: |
          npm ci

      - name: Render 3D Reel
        run: |
          mkdir -p out
          python3 automate_reel.py --preset ${{ github.event.inputs.preset }} -o out/${{ github.event.inputs.output_name }}

      - name: Upload Rendered MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}
          path: out/${{ github.event.inputs.output_name }}
          retention-days: 7
